version: 2
updates:
  # 公開直後の版は入れず、1 週間様子を見てから更新する (脆弱性修正の更新はこの待ち時間の対象外)。
  # メジャーバージョンの更新は PR を出させず、手動で判断して入れる (脆弱性修正の更新はこの ignore の対象外)。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /video
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # 版を揃える必要があるものは 1 つの PR にまとめる。
    groups:
      remotion:
        patterns:
          - "remotion"
          - "@remotion/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
